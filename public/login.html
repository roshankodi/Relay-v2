<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in — Relay</title>
  <script>
    (function() {
      try {
        var saved = localStorage.getItem('theme');
        var dark = saved ? saved === 'dark' : true;
        if (dark) document.documentElement.classList.add('dark');
        else document.documentElement.classList.remove('dark');
      } catch (e) {}
    })();
  </script>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div style="min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between; align-items: center; padding: 24px; box-sizing: border-box; position:relative; z-index:1;">
    <header class="topbar" style="width: 100%; max-width: 1320px; margin: 0 auto; padding: 16px 32px; border-radius: var(--radius-xl); background: var(--glass-bg); backdrop-filter: blur(var(--glass-blur)); -webkit-backdrop-filter: blur(var(--glass-blur)); border: 1px solid var(--glass-border); display:flex; justify-content:space-between; align-items:center;">
      <a class="brand" href="/" style="font-size:22px; font-weight:900; letter-spacing:-0.5px; color:var(--color-text-primary); text-decoration:none;">Relay</a>
      <div style="display:flex; gap:12px; align-items:center;">
        <button class="btn btn-ghost btn-icon" id="theme-btn" aria-label="Toggle theme" style="width:38px; height:38px; border-radius:var(--radius-md); border:1px solid var(--glass-border); display:grid; place-items:center; cursor:pointer; background:var(--glass-bg); color:var(--color-text-primary);"></button>
        <a class="btn btn-ghost" href="/" style="font-size:14px; font-weight:600; color:var(--color-text-secondary);">← Back to Home</a>
      </div>
    </header>

    <main class="card card-glass" style="max-width: 440px; width: 100%; padding: 40px; border-radius: var(--radius-2xl); background: var(--glass-bg); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid var(--glass-border); box-shadow: var(--shadow-lg); margin: 40px 0;">
      <div style="text-align:center; margin-bottom: 28px;">
        <div style="width: 48px; height: 48px; border-radius: 50%; background: linear-gradient(135deg, var(--color-brand-accent), #1B5E3A); color: #FFF; display: grid; place-items: center; margin: 0 auto 14px; font-size: 20px; font-weight: 800; box-shadow: 0 4px 16px rgba(46,125,79,0.3);">R</div>
        <h1 style="font-size: 26px; font-weight: 800; margin-bottom: 6px; letter-spacing:-0.5px;" id="form-title">Sign in</h1>
        <p class="text-muted" style="margin: 0; font-size: 15px;" id="form-subtitle">Welcome back to Relay.</p>
      </div>

      <a href="/auth/google" class="btn" style="width: 100%; padding: 12px 20px; border-radius: var(--radius-lg); background: var(--glass-bg); border: 1px solid var(--glass-border); backdrop-filter: blur(8px); display:flex; align-items:center; justify-content:center; gap: 12px; font-size:14px; font-weight:600; color:var(--color-text-primary); text-decoration:none; box-shadow: var(--shadow-xs);">
        <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
          <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.9 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l5.7-5.7C34.6 6 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/>
          <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.9 18.9 13 24 13c3.1 0 5.8 1.1 8 3l5.7-5.7C34.6 6 29.6 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/>
          <path fill="#4CAF50" d="M24 44c5.5 0 10.4-1.9 14.3-5.1l-6.6-5.6C29.6 35.4 27 36 24 36c-5.3 0-9.7-3.1-11.3-7.5l-6.6 5.1C9.6 39.6 16.2 44 24 44z"/>
          <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.2 4.2-4.1 5.6l6.6 5.6C41.9 36 44 30.7 44 24c0-1.3-.1-2.7-.4-3.5z"/>
        </svg>
        Continue with Google
      </a>

      <div style="display:flex; align-items:center; gap:12px; margin:22px 0; color:var(--color-text-secondary); font-size:11px; font-weight:800; letter-spacing:1px;">
        <div style="flex:1; height:1px; background:var(--glass-border);"></div>OR EMAIL<div style="flex:1; height:1px; background:var(--glass-border);"></div>
      </div>

      <form id="auth-form" novalidate style="display:flex; flex-direction:column; gap:16px;">
        <div class="field" id="name-field" hidden>
          <label for="fullName" style="font-size:13px; font-weight:700; margin-bottom:6px; display:block;">Full name</label>
          <input id="fullName" name="fullName" autocomplete="name" placeholder="Jamie Rivera" style="width:100%; padding:12px 16px; border-radius:var(--radius-lg); background:var(--glass-bg); border:1px solid var(--glass-border); color:var(--color-text-primary); font-size:14px;" />
        </div>
        <div class="field">
          <label for="email" style="font-size:13px; font-weight:700; margin-bottom:6px; display:block;">Email address</label>
          <input id="email" name="email" type="email" autocomplete="email" placeholder="name@company.com" required style="width:100%; padding:12px 16px; border-radius:var(--radius-lg); background:var(--glass-bg); border:1px solid var(--glass-border); color:var(--color-text-primary); font-size:14px;" />
        </div>
        <div class="field">
          <label for="password" style="font-size:13px; font-weight:700; margin-bottom:6px; display:block;">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="••••••••" required minlength="6" style="width:100%; padding:12px 16px; border-radius:var(--radius-lg); background:var(--glass-bg); border:1px solid var(--glass-border); color:var(--color-text-primary); font-size:14px;" />
        </div>
        <p class="error-text" id="form-error" role="alert" style="color:var(--color-danger); font-size:13px; margin:4px 0 0;"></p>
        <button class="btn btn-primary" type="submit" style="width: 100%; padding:14px; font-size:15px; font-weight:600; margin-top:8px; box-shadow: 0 4px 16px rgba(46,125,79,0.25);" id="submit-btn">
          <span id="submit-label">Sign in</span>
        </button>
      </form>

      <p style="margin-top: 24px; font-size: 14px; text-align: center; color:var(--color-text-secondary);">
        <span id="toggle-prompt">Don't have an account?</span>
        <a href="#" id="toggle-mode" style="font-weight:700; color:var(--color-brand-accent); margin-left:4px;">Create one</a>
      </p>
    </main>
  </div>

  <script type="module">
    import { api, toast, icon, toggleTheme } from '/js/shared.js';

    function updateThemeIcon() {
      const themeBtn = document.getElementById('theme-btn');
      if (themeBtn) {
        themeBtn.innerHTML = icon(document.documentElement.classList.contains('dark') ? 'sun' : 'moon', { size: 16 });
      }
    }
    updateThemeIcon();
    document.getElementById('theme-btn')?.addEventListener('click', () => {
      toggleTheme();
      updateThemeIcon();
    });

    const form = document.getElementById('auth-form');
    const errorEl = document.getElementById('form-error');
    const nameField = document.getElementById('name-field');
    const title = document.getElementById('form-title');
    const subtitle = document.getElementById('form-subtitle');
    const submitLabel = document.getElementById('submit-label');
    const togglePrompt = document.getElementById('toggle-prompt');
    const toggleMode = document.getElementById('toggle-mode');
    const submitBtn = document.getElementById('submit-btn');

    let mode = 'login';

    function render() {
      const isSignup = mode === 'signup';
      nameField.hidden = !isSignup;
      document.getElementById('fullName').required = isSignup;
      document.getElementById('fullName').minLength = isSignup ? 2 : 0;
      title.textContent = isSignup ? 'Create an account' : 'Sign in';
      subtitle.textContent = isSignup ? 'Start reviewing media with your team.' : 'Welcome back.';
      submitLabel.textContent = isSignup ? 'Create account' : 'Sign in';
      togglePrompt.textContent = isSignup ? 'Already have an account?' : "Don't have an account?";
      toggleMode.textContent = isSignup ? 'Sign in' : 'Create one';
      errorEl.textContent = '';
    }

    toggleMode.addEventListener('click', e => {
      e.preventDefault();
      mode = mode === 'login' ? 'signup' : 'login';
      render();
    });

    form.addEventListener('submit', async e => {
      e.preventDefault();
      errorEl.textContent = '';
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const fullName = document.getElementById('fullName').value.trim();

      submitBtn.disabled = true;
      try {
        if (mode === 'signup') {
          const result = await api('/api/auth/signup', { method: 'POST', body: { email, password, fullName } });
          if (result.message) {
            toast(result.message);
            mode = 'login';
            render();
          } else {
            window.location.href = '/app';
          }
        } else {
          await api('/api/auth/login', { method: 'POST', body: { email, password } });
          window.location.href = '/app';
        }
      } catch (err) {
        errorEl.textContent = err.message;
      } finally {
        submitBtn.disabled = false;
      }
    });

    render();
  </script>
<!-- impeccable-live-start -->
<script src="http://localhost:8400/live.js?token=0b03114c-cac8-48dd-9879-2111cd55959d"></script>
<!-- impeccable-live-end -->
</body>
</html>
