<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Review — Relay</title>
  <script>
    (function() {
      try {
        var saved = localStorage.getItem('theme');
        var dark = saved ? saved === 'dark' : true;
        if (dark) document.documentElement.classList.add('dark');
        else document.documentElement.classList.remove('dark');
      } catch (e) {}
    })();
  </script>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="/css/tokens.css" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="app-shell">
    <div class="shell-content">
      <header class="topbar">
        <a class="brand" href="/app">Relay</a>
        <div style="display:flex; gap:10px; align-items:center;">
          <button class="btn btn-ghost btn-icon" id="theme-btn" aria-label="Toggle theme"></button>
          <button class="btn btn-ghost" id="share-media-btn" hidden style="gap:6px; border-radius:var(--radius-pill); font-weight:600;"></button>
          <div class="sidebar-account" id="sidebar-account" title="Account" style="width:34px; height:34px; border-radius:50%; background:linear-gradient(135deg, var(--color-brand-accent), #1B5E3A); color:#FFF; display:grid; place-items:center; font-size:12px; font-weight:800; box-shadow:0 2px 8px rgba(46,125,79,0.3);">·</div>
          <button class="btn btn-ghost" id="signout-btn">Sign out</button>
        </div>
      </header>

      <main class="container media-page-container">
        <a href="#" id="back-link" class="btn btn-ghost" style="display:inline-flex; align-items:center; gap:6px; margin-bottom:18px; padding:7px 16px; border-radius:var(--radius-pill); font-size:13px; font-weight:700; text-decoration:none; border:1px solid var(--glass-border); background:var(--glass-bg);">← Back to workspace</a>
        <h1 id="media-name" style="font-size:26px; font-weight:800; letter-spacing:-0.6px; line-height:1.25; margin:0 0 4px; color:var(--color-text-primary);">Loading…</h1>
        <p class="text-muted" style="font-size:13px; font-weight:500; margin:0 0 24px; color:var(--color-text-secondary);">Frame-accurate media review & timeline feedback space</p>

        <div class="grid review-layout">
          <section class="card card-glass" style="overflow:hidden; border-radius:var(--radius-2xl);" id="stage-card">
            <div class="skeleton" style="aspect-ratio:16/9;"></div>
          </section>

          <aside style="display:flex; flex-direction:column; height:100%;">
            <div class="card card-glass" style="border-radius:var(--radius-2xl); padding:20px; display:flex; flex-direction:column; max-height:calc(100vh - 180px); min-height:540px; height:100%; box-sizing:border-box;">
              <!-- Header Bar -->
              <div style="display:flex; align-items:center; justify-content:space-between; padding-bottom:14px; border-bottom:1px solid var(--glass-border); flex-shrink:0;">
                <h2 style="font-size:13px; color:var(--color-text-secondary); font-weight:800; text-transform:uppercase; letter-spacing:0.04em; margin:0;">COMMENTS</h2>
                <span class="text-muted" id="comment-count" style="font-size:12px; font-weight:600;"></span>
              </div>

              <!-- Scrollable Feed -->
              <div class="comment-list" id="comments" style="flex:1; min-height:0; overflow-y:auto; padding:14px 4px 14px 0; display:flex; flex-direction:column; gap:12px;"></div>

              <!-- Bottom Input Bar -->
              <form id="comment-form" style="margin-top:auto; padding-top:14px; border-top:1px solid var(--glass-border); flex-shrink:0;">
                <div style="display:flex; align-items:center; gap:8px; background:var(--glass-bg); border:1px solid var(--glass-border); border-radius:var(--radius-pill); padding:6px 8px 6px 14px; box-shadow:inset 0 1px 3px rgba(0,0,0,0.12);">
                  <span class="anchor-badge" id="anchor-badge" style="flex-shrink:0;">0:00</span>
                  <input type="text" id="comment-body" placeholder="Leave your comment…" required maxlength="5000" style="flex:1; background:transparent; border:none; color:var(--color-text-primary); font-size:13px; outline:none; font-family:inherit; padding:8px 12px; margin-left:4px;" />
                  <button type="submit" class="btn btn-primary" style="width:34px; height:34px; border-radius:50%; padding:0; display:grid; place-items:center; flex-shrink:0; font-size:13px; box-shadow:0 2px 10px rgba(46,125,79,0.4);" title="Send comment">➤</button>
                </div>
              </form>
            </div>
          </aside>
        </div>
      </main>
    </div>
  </div>

  <script type="module">
    import { api, toggleTheme, requireSession, initials, icon } from '/js/shared.js';
    import { initReviewPage } from '/js/player.js';
    import { initShareDialog } from '/js/share-dialog.js';

    function paintThemeIcon() {
      document.getElementById('theme-btn').innerHTML = icon(document.documentElement.classList.contains('dark') ? 'sun' : 'moon', { size: 16 });
    }
    paintThemeIcon();
    document.getElementById('theme-btn').addEventListener('click', () => {
      toggleTheme();
      paintThemeIcon();
    });
    document.getElementById('signout-btn').addEventListener('click', async () => {
      await api('/api/auth/logout', { method: 'POST' }).catch(() => {});
      window.location.href = '/login';
    });

    const parts = location.pathname.split('/').filter(Boolean); // app, workspaces, :id, media, :mediaId
    const workspaceId = parts[2];
    const mediaId = parts[4];
    document.getElementById('back-link').href = `/app/workspaces/${workspaceId}`;

    const page = initReviewPage({
      stageCard: document.getElementById('stage-card'),
      commentsEl: document.getElementById('comments'),
      commentCountEl: document.getElementById('comment-count'),
      composerForm: document.getElementById('comment-form'),
      bodyInput: document.getElementById('comment-body'),
      anchorBadge: document.getElementById('anchor-badge'),
      adapter: {
        loadMedia: () => api(`/api/media/${mediaId}`),
        createComment: payload => api('/api/comments', { method: 'POST', body: payload }),
        editComment: (id, body) => api(`/api/comments/${id}`, { method: 'PATCH', body: { body } }),
        deleteComment: id => api(`/api/comments/${id}`, { method: 'DELETE' }),
      },
      onMediaLoaded: media => {
        if (!media.workspaceIsOwner) return;
        const shareBtn = document.getElementById('share-media-btn');
        shareBtn.hidden = false;
        shareBtn.innerHTML = icon('share', { size: 15 }) + 'Share';
        const shareDialog = initShareDialog({
          workspaceId,
          mediaPath: `/media/${mediaId}`,
          title: 'Share this file',
          description: 'Anyone with the link opens straight to this file and can comment — no account needed. (They can also navigate to the rest of the workspace from here, since sharing is workspace-wide.)',
        });
        shareBtn.addEventListener('click', () => shareDialog.open());
      },
    });

    requireSession().then(session => {
      if (!session) return;
      const el = document.getElementById('sidebar-account');
      if (el) el.textContent = initials(session.profile?.display_name || session.user?.email || '?');
      page.start();
    });
  </script>
</body>
</html>
