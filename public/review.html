<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Shared review — Relay</title>
  <script>
    (function() {
      try {
        var saved = localStorage.getItem('theme');
        var dark = saved ? saved === 'dark' : true;
        if (dark) document.documentElement.classList.add('dark');
        else document.documentElement.classList.remove('dark');
      } catch (e) {}
    })();
  </script>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="shell-card shell-card-wide">
    <div class="guest-banner" id="guest-banner" hidden>
      <span>Reviewing as <strong id="guest-name-label"></strong></span>
      <button class="btn btn-ghost" id="change-identity-btn" style="padding:4px 10px; font-size:12px;">Not you?</button>
    </div>
    <header class="topbar">
      <span class="brand">Relay</span>
      <button class="btn btn-ghost btn-icon" id="theme-btn" aria-label="Toggle theme"></button>
    </header>

    <main class="container">
      <h1 id="w-name" style="font-size: 24px; margin-bottom: 4px;">Loading…</h1>
      <p class="text-muted" id="w-desc" style="font-size:14px;"></p>
      <div id="grid" class="grid grid-3" style="margin-top:20px;" aria-live="polite">
        <div class="card skeleton" style="aspect-ratio:16/9;"></div>
        <div class="card skeleton" style="aspect-ratio:16/9;"></div>
        <div class="card skeleton" style="aspect-ratio:16/9;"></div>
      </div>
    </main>
  </div>

  <script type="module">
    import { api, toggleTheme, escapeHtml, toast, getGuestIdentity, icon } from '/js/shared.js';
    import { openGuestIdentityDialog } from '/js/guest-identity.js';

    function paintThemeIcon() {
      document.getElementById('theme-btn').innerHTML = icon(document.documentElement.classList.contains('dark') ? 'sun' : 'moon', { size: 16 });
    }
    paintThemeIcon();
    document.getElementById('theme-btn').addEventListener('click', () => {
      toggleTheme();
      paintThemeIcon();
    });

    const token = location.pathname.split('/').filter(Boolean)[1];
    const grid = document.getElementById('grid');
    const KIND_ICON = { video: 'video', audio: 'music', image: 'image' };

    function renderGuestBanner() {
      const identity = getGuestIdentity();
      const banner = document.getElementById('guest-banner');
      if (identity) {
        banner.hidden = false;
        document.getElementById('guest-name-label').textContent = identity.name;
      } else {
        banner.hidden = true;
      }
    }
    document.getElementById('change-identity-btn').addEventListener('click', () => openGuestIdentityDialog({ force: true }).then(renderGuestBanner));

    function render(workspace, media) {
      document.getElementById('w-name').textContent = workspace.name;
      document.getElementById('w-desc').textContent = workspace.description || '';
      document.title = `${workspace.name} — Relay`;
      if (!media.length) {
        grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;"><div class="empty-icon">${icon('folder', { size: 26 })}</div>No media in this workspace yet.</div>`;
        return;
      }
      grid.innerHTML = media
        .map(m => {
          const kindIcon = icon(KIND_ICON[m.media_kind] || 'file', { size: 30 });
          const thumb = m.thumbnail_url
            ? `<img src="${escapeHtml(m.thumbnail_url)}" alt="" loading="lazy" class="thumb-img"
                 onload="this.classList.add('loaded')" onerror="this.style.display='none'; this.nextElementSibling.hidden=false;" />
               <span class="thumb-fallback" hidden>${kindIcon}</span>`
            : `<span class="thumb-fallback">${kindIcon}</span>`;
          return `<a class="card media-tile" href="/review/${token}/media/${m.id}" style="text-decoration:none; color:inherit;">
            <div class="thumb">${thumb}</div>
            <div class="meta">
              <div style="font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${escapeHtml(m.name)}</div>
              <div class="text-muted" style="font-size:12px; margin-top:2px;">${m.media_kind}</div>
            </div>
          </a>`;
        })
        .join('');
    }

    async function load() {
      try {
        const { workspace, media } = await api(`/api/public/${token}`);
        render(workspace, media);
      } catch (e) {
        grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;">
          <div class="empty-icon">🔒</div>
          <p>${escapeHtml(e.message || "This share link isn't valid.")}</p>
        </div>`;
      }
    }

    renderGuestBanner();
    load();
  </script>
<!-- impeccable-live-start -->
<script src="http://localhost:8400/live.js?token=0b03114c-cac8-48dd-9879-2111cd55959d"></script>
<!-- impeccable-live-end -->
</body>
</html>
